name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [release, debug, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build out/${{ matrix.preset }} -j 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir out/${{ matrix.preset }} --output-on-failure
      - name: Seeded fuzz soak
        if: matrix.preset == 'release'
        run: out/release/fuzz_ops --seed 1 100 10000
      - name: Installed consumer
        if: matrix.preset == 'release'
        run: |
          cmake --install out/release --prefix "$RUNNER_TEMP/hm-install"
          cmake -S tests/consumer -B out/consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/hm-install"
          cmake --build out/consumer
          out/consumer/hm_consumer
